name: FindMyCrew
options:
  bundleIdPrefix: com.findmycrew
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    # One version for the app and fmc; scripts/release/build.sh overrides both from the release tag.
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  FindMyCrew:
    type: application
    platform: macOS
    sources:
      - path: FindMyCrew
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        PRODUCT_NAME: Find My Crew
        PRODUCT_MODULE_NAME: FindMyCrew
        PRODUCT_BUNDLE_IDENTIFIER: com.findmycrew.app
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Find My Crew
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.photography
        INFOPLIST_KEY_NSHumanReadableCopyright: "Find My Crew. Face recognition model: SFace (OpenCV Zoo, Apache-2.0)."
        CODE_SIGN_ENTITLEMENTS: FindMyCrew/FindMyCrew.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        COREML_CODEGEN_LANGUAGE: None
        COMBINE_HIDPI_IMAGES: YES
    # fmc ships inside the app (Contents/Helpers) and finds the app's compiled model in Contents/Resources;
    # the installer links it onto PATH.
    dependencies:
      - target: fmc
        embed: true
        codeSign: true
        copy:
          destination: productsDirectory
          subpath: $(CONTENTS_FOLDER_PATH)/Helpers

  # Hostless: compiles Core + the model directly, so tests run outside the app sandbox
  # (and don't depend on SwiftUI). Same approach as fmc-eval.
  FindMyCrewTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: FindMyCrewTests
        excludes:
          - "Fixtures/**"
          - "**/.DS_Store"
      # Public-domain test photos, copied as a folder into the test bundle.
      - path: FindMyCrewTests/Fixtures
        type: folder
        buildPhase: resources
      - path: FindMyCrew/Core
      - path: FindMyCrewCLI
      # The wizard state machine (no SwiftUI), so the whole flow can be tested headlessly.
      - path: FindMyCrew/App
        excludes:
          - "FindMyCrewApp.swift"
      - path: FindMyCrew/Resources/Models/SFace.mlpackage
    settings:
      base:
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) FMC_TESTING"
        PRODUCT_BUNDLE_IDENTIFIER: com.findmycrew.tests
        GENERATE_INFOPLIST_FILE: YES
        COREML_CODEGEN_LANGUAGE: None
    dependencies:
      - package: swift-argument-parser
        product: ArgumentParser
      - package: libwebp
      - target: fmc
        link: false

  fmc-eval:
    type: tool
    platform: macOS
    sources:
      - FindMyCrewEval
      - path: FindMyCrew/Core
    settings:
      base:
        PRODUCT_NAME: fmc-eval
        PRODUCT_BUNDLE_IDENTIFIER: com.findmycrew.eval

  # The command-line tool: the app's Core with a CLI front end instead of SwiftUI.
  fmc:
    type: tool
    platform: macOS
    sources:
      - FindMyCrewCLI
      - path: FindMyCrew/Core
    dependencies:
      - package: swift-argument-parser
        product: ArgumentParser
      - package: libwebp
    settings:
      base:
        PRODUCT_NAME: fmc
        PRODUCT_BUNDLE_IDENTIFIER: com.findmycrew.cli
        ENABLE_HARDENED_RUNTIME: YES
        # Embedded Info.plist, so `fmc --version` reports MARKETING_VERSION.
        GENERATE_INFOPLIST_FILE: YES
        CREATE_INFOPLIST_SECTION_IN_BINARY: YES
        # coremlcompiler replaces SFace.mlmodelc wholesale, which the script sandbox denies.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    # A tool has no Resources folder, so the compiled model sits next to the binary, where fmc looks for it.
    postBuildScripts:
      - name: Compile SFace model
        script: xcrun coremlcompiler compile "$SRCROOT/FindMyCrew/Resources/Models/SFace.mlpackage" "$BUILT_PRODUCTS_DIR" >/dev/null
        inputFiles:
          - $(SRCROOT)/FindMyCrew/Resources/Models/SFace.mlpackage/Manifest.json
          - $(SRCROOT)/FindMyCrew/Resources/Models/SFace.mlpackage/Data/com.apple.CoreML/model.mlmodel
          - $(SRCROOT)/FindMyCrew/Resources/Models/SFace.mlpackage/Data/com.apple.CoreML/weights/weight.bin
        outputFiles:
          - $(BUILT_PRODUCTS_DIR)/SFace.mlmodelc

packages:
  swift-argument-parser:
    url: https://github.com/apple/swift-argument-parser
    from: 1.8.0
  # libwebp built from source: ImageIO reads WebP but can't write it.
  libwebp:
    url: https://github.com/SDWebImage/libwebp-Xcode
    from: 1.6.0

schemes:
  FindMyCrew:
    build:
      targets:
        FindMyCrew: all
        FindMyCrewTests: [test]
    test:
      targets:
        - FindMyCrewTests
    run:
      config: Debug
  fmc-eval:
    build:
      targets:
        fmc-eval: all
    run:
      config: Release
  fmc:
    build:
      targets:
        fmc: all
    run:
      config: Release
