name: FindMyCrew
options:
  bundleIdPrefix: com.findmycrew
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual

targets:
  FindMyCrew:
    type: application
    platform: macOS
    sources:
      - path: FindMyCrew
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        PRODUCT_NAME: Find My Crew
        PRODUCT_MODULE_NAME: FindMyCrew
        PRODUCT_BUNDLE_IDENTIFIER: com.findmycrew.app
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Find My Crew
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.photography
        INFOPLIST_KEY_NSHumanReadableCopyright: "Find My Crew. Face recognition model: SFace (OpenCV Zoo, Apache-2.0)."
        CODE_SIGN_ENTITLEMENTS: FindMyCrew/FindMyCrew.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        COREML_CODEGEN_LANGUAGE: None
        COMBINE_HIDPI_IMAGES: YES

  # Hostless: compiles Core + the model directly, so tests run outside the app sandbox
  # (and don't depend on SwiftUI). Same approach as fmc-eval.
  FindMyCrewTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: FindMyCrewTests
        excludes:
          - "Fixtures/**"
          - "**/.DS_Store"
      # Public-domain test photos, copied as a folder into the test bundle.
      - path: FindMyCrewTests/Fixtures
        type: folder
        buildPhase: resources
      - path: FindMyCrew/Core
      # The wizard state machine (no SwiftUI), so the whole flow can be tested headlessly.
      - path: FindMyCrew/App
        excludes:
          - "FindMyCrewApp.swift"
      - path: FindMyCrew/Resources/Models/SFace.mlpackage
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.findmycrew.tests
        GENERATE_INFOPLIST_FILE: YES
        COREML_CODEGEN_LANGUAGE: None

  fmc-eval:
    type: tool
    platform: macOS
    sources:
      - FindMyCrewEval
      - path: FindMyCrew/Core
    settings:
      base:
        PRODUCT_NAME: fmc-eval
        PRODUCT_BUNDLE_IDENTIFIER: com.findmycrew.eval

schemes:
  FindMyCrew:
    build:
      targets:
        FindMyCrew: all
        FindMyCrewTests: [test]
    test:
      targets:
        - FindMyCrewTests
    run:
      config: Debug
  fmc-eval:
    build:
      targets:
        fmc-eval: all
    run:
      config: Release
